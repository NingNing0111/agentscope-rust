[package]
name = "agent_scope_rag"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentScope RAG System — Parser, Chunker, VectorStore, KnowledgeBase, RAGMiddleware"

[features]
default = []
xberg = ["dep:xberg"]

[dependencies]
agent_scope_types = { path = "../agent_scope_types" }
agent_scope_embedding = { path = "../agent_scope_embedding" }
agent_scope_model = { path = "../agent_scope_model" }
agent_scope_agent = { path = "../agent_scope_agent" }
agent_scope_memory = { path = "../agent_scope_memory" }
agent_scope_message = { path = "../agent_scope_message" }
agent_scope_tool = { path = "../agent_scope_tool" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
turbovec.workspace = true
xberg = { workspace = true, optional = true, features = ["tokio-runtime", "pdf", "office", "excel", "html"] }

[dev-dependencies]
tempfile.workspace = true
