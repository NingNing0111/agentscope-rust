[package]
name = "agentscope"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autoexamples = false

[workspace]
members = [
    "crates/*",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agentscope-ai/agentscope"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
schemars = "0.8"
clap = { version = "4", features = ["derive", "env"] }

[dependencies]
agent_scope_agent = { path = "crates/agent_scope_agent" }
agent_scope_dashscope = { path = "crates/agent_scope_dashscope" }
agent_scope_tool = { path = "crates/agent_scope_tool" }
agent_scope_message = { path = "crates/agent_scope_message" }
agent_scope_event = { path = "crates/agent_scope_event" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

[[example]]
name = "chat"
path = "examples/chat.rs"

[[example]]
name = "verify_agent"
path = "examples/verify_agent.rs"
