[package]
name = "agent_scope_mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) client integration for AgentScope: real connections, tool discovery, and remote tool adaptation."

[dependencies]
agent_scope_message = { path = "../agent_scope_message" }
agent_scope_tool = { path = "../agent_scope_tool" }
agent_scope_workspace = { path = "../agent_scope_workspace" }
agent_scope_utils = { path = "../agent_scope_utils" }

async-trait.workspace = true
chrono.workspace = true
http.workspace = true
# Official MCP Rust SDK — the sole protocol implementation (Feature 027).
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-worker",
] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

[dev-dependencies]
# In-process integration tests need the server + macros features (the
# #[tool_router]/#[tool] macros) which are not part of the library's
# default-features=false build. schemars must match rmcp's version (1.x), not
# the workspace's 0.8, because the derive macro generates `schemars::` paths.
rmcp = { workspace = true, features = [
    "client",
    "macros",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-worker",
] }
schemars_1.workspace = true
serde.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
