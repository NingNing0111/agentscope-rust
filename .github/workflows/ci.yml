name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # turbovec → faer/openblas-sys links against the system libopenblas.
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Cargo check
        run: cargo check --workspace --all-targets
      - name: Cargo test
        run: cargo test --workspace
      - name: RAG xberg parser tests
        run: cargo test -p agent_scope_rag --features xberg --all-targets
      - name: RAG example with xberg
        run: cargo check -p rag --features xberg --all-targets

  quality:
    name: Format, clippy, and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        # Doc tests link the full dependency graph including turbovec/openblas.
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (xberg parser)
        run: cargo clippy -p agent_scope_rag --features xberg --all-targets -- -D warnings
      - name: Clippy (rag example with xberg)
        run: cargo clippy -p rag --features xberg --all-targets -- -D warnings
      - name: Documentation tests
        run: cargo test --workspace --doc
