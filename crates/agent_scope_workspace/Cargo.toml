[package]
name = "agent_scope_workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent_scope_utils = { path = "../agent_scope_utils" }
agent_scope_message = { path = "../agent_scope_message" }

async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
mime_guess.workspace = true
# Safe wrapper around the Unix process-group syscalls; used to reap a child
# *and* any grandchildren on timeout / output overflow (defect 2 fix).
# Kept behind `cfg(unix)` in backend.rs.
nix = { workspace = true, features = ["signal", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "process", "rt", "macros", "time"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
agent_scope_sandbox = { path = "../agent_scope_sandbox" }
async-trait.workspace = true
tempfile.workspace = true
