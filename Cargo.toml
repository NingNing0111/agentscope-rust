[package]
name = "agentscope"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autoexamples = false

[workspace]
members = [
    "crates/*",
    "examples/quickstart",
    "examples/chat",
    "examples/tool",
    "examples/mcp",
    "examples/skill",
    "examples/agent",
    "examples/human-in-the-loop",
    "examples/memory",
    "examples/rag",
    "examples/workspace",
    "examples/sandbox",
    "examples/plan-react-agent",
    "examples/subagent",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ningning0111/agentscope-rust"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
dotenv = "0.15"
futures = "0.3"
globset = "0.4.20"
gray_matter = { version = "0.3.2", default-features = false, features = [
    "yaml",
] }
http = "1"
mime_guess = "2"
microsandbox = "0.6.10"
nix = { version = "0.29", default-features = false }
regex = "1"
# Feature 027: Official MCP Rust SDK — the sole protocol implementation.
rmcp = { version = "3.1.1", default-features = false }
schemars = "0.8"
schemars_08 = { package = "schemars", version = "0.8" }
# Feature 034: rig-core 0.41.0 depends on schemars 1.x. Keep this separate
# from workspace schemars 0.8 for code that must interoperate with rig types.
schemars_1 = { package = "schemars", version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-test = "0.4"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
turbovec = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }
xberg = { version = "1.0.14", default-features = false }
walkdir = "2.5.0"
wiremock = "0.6"
# Feature 034: rig LLM provider framework. Pinned to crates.io release 0.41.0
# (0.42.0 is only in the rig repo main branch, unpublished). Default features
# (rig-core reqwest/derive/rustls + agent) are used; openai/anthropic/deepseek
# providers are built into rig-core with no extra feature gate.
rig = "0.41"

[dependencies]
agent_scope_agent = { path = "crates/agent_scope_agent" }
agent_scope_rig = { path = "crates/agent_scope_rig" }
agent_scope_tool = { path = "crates/agent_scope_tool" }
agent_scope_message = { path = "crates/agent_scope_message" }
agent_scope_event = { path = "crates/agent_scope_event" }
agent_scope_memory = { path = "crates/agent_scope_memory" }
agent_scope_state = { path = "crates/agent_scope_state" }
agent_scope_rag = { path = "crates/agent_scope_rag" }
agent_scope_embedding = { path = "crates/agent_scope_embedding" }
agent_scope_workspace = { path = "crates/agent_scope_workspace" }
agent_scope_mcp = { path = "crates/agent_scope_mcp" }
agent_scope_sandbox = { path = "crates/agent_scope_sandbox" }
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
async-trait.workspace = true
dotenv.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid.workspace = true
