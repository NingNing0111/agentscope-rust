[package]
name = "pi-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "pi-rust"

[[bin]]
name = "pi-rust"
path = "src/main.rs"

[dependencies]
agent_scope_agent = { path = "../../crates/agent_scope_agent" }
agent_scope_dashscope = { path = "../../crates/agent_scope_dashscope" }
agent_scope_tool = { path = "../../crates/agent_scope_tool" }
agent_scope_message = { path = "../../crates/agent_scope_message" }
agent_scope_event = { path = "../../crates/agent_scope_event" }
agent_scope_memory = { path = "../../crates/agent_scope_memory" }
agent_scope_rag = { path = "../../crates/agent_scope_rag" }
agent_scope_embedding = { path = "../../crates/agent_scope_embedding" }
agent_scope_workspace = { path = "../../crates/agent_scope_workspace" }
agent_scope_model = { path = "../../crates/agent_scope_model" }
agent_scope_types = { path = "../../crates/agent_scope_types" }
async-trait = "0.1"
chrono.workspace = true
clap.workspace = true
futures = "0.3"
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

[dev-dependencies]
tempfile = "3"
